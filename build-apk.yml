# Simpan file ini di repo kamu sebagai:  .github/workflows/build-apk.yml
# Taruh file game (misal index.html atau ZooFootball.html) di root repo.
# Cara jalan: push ke branch main/master, atau tab Actions > "Build APK" > Run workflow.
# Hasil: tab Actions > pilih run > bagian Artifacts > unduh "ZooFootball-debug-apk".

name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  APP_NAME: ZooSoccer
  APP_ID: com.zoosoccer.game
  # Opsional (untuk APK rilis yang ditandatangani) - isi di Settings > Secrets and variables > Actions:
  #   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS
  KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
  KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
  KS_ALIAS: ${{ secrets.KEY_ALIAS }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang Android SDK
        uses: android-actions/setup-android@v3

      - name: Siapkan proyek Capacitor
        shell: bash
        run: |
          set -e
          # cari file game: index.html dulu, kalau tidak ada pakai file .html pertama di root
          if [ -f index.html ]; then GAME=index.html; else GAME=$(ls *.html 2>/dev/null | head -n 1); fi
          if [ -z "$GAME" ]; then echo "Tidak ada file .html di root repo"; exit 1; fi
          echo "File game: $GAME"
          mkdir -p app/www
          cp "$GAME" app/www/index.html
          cd app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "$APP_NAME" "$APP_ID" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Atur layar (portrait + layar penuh) dan nomor versi
        shell: bash
        run: |
          set -e
          cd app/android/app
          # kunci orientasi portrait
          sed -i 's/android:launchMode="singleTask"/android:launchMode="singleTask" android:screenOrientation="portrait"/' src/main/AndroidManifest.xml
          # layar penuh tanpa status bar
          sed -i '/<style name="AppTheme.NoActionBar"/a\        <item name="android:windowFullscreen">true</item>' src/main/res/values/styles.xml
          # nomor versi naik otomatis setiap build
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" build.gradle

      - name: Build APK debug
        shell: bash
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Unggah APK debug
        uses: actions/upload-artifact@v4
        with:
          name: ZooFootball-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk

      - name: Build dan tanda tangani APK rilis (jalan jika secrets diisi)
        if: ${{ env.KS_B64 != '' }}
        shell: bash
        run: |
          set -e
          cd app/android
          ./gradlew assembleRelease --no-daemon
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          IN=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          "$ANDROID_HOME/build-tools/$BT/zipalign" -f -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          mkdir -p "$GITHUB_WORKSPACE/out"
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
            --ks-key-alias "$KS_ALIAS" \
            --out "$GITHUB_WORKSPACE/out/ZooFootball-release.apk" \
            "$RUNNER_TEMP/aligned.apk"

      - name: Unggah APK rilis
        if: ${{ env.KS_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ZooFootball-release-apk
          path: out/ZooFootball-release.apk
